<title>Twenty Bar</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: one narrow column, like a card held in the hand. Cards open one drink; no hash shows all nine. */
:root {
  --bg: #f3f4f6;
  --surface: #ffffff;
  --fg: #14161a;
  --muted: #646a73;
  --line: #d9dce1;
  --accent: #c8283a;
  --accent-fg: #ffffff;
  --font-display: "Space Grotesk", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1114; --surface: #171a1f; --fg: #eef0f3; --muted: #9aa1ab; --line: #2a2e35; --accent: #ff5a6b; --accent-fg: #14161a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1114; --surface: #171a1f; --fg: #eef0f3; --muted: #9aa1ab; --line: #2a2e35; --accent: #ff5a6b; --accent-fg: #14161a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 16px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 48px; min-height: 100%;
}
main { max-width: 30rem; margin: 0 auto; display: flex; flex-direction: column; gap: 28px; }
a { color: inherit; }
a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.eyebrow { font-family: var(--font-display); font-weight: 500; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(2.1rem, 9vw, 2.8rem); line-height: 1.05; margin: 6px 0 0; text-wrap: balance; letter-spacing: -.02em; }
h2 { font-family: var(--font-display); font-weight: 700; font-size: 1.05rem; margin: 0 0 12px; letter-spacing: .01em; }
.tagline { font-family: var(--font-display); font-weight: 500; font-size: 1.05rem; color: var(--accent); margin: 10px 0 0; text-wrap: balance; }
.msg { font-style: italic; color: var(--muted); margin: 14px 0 0; max-width: 34ch; }
.tag { display: inline-block; margin-top: 14px; font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; padding: 3px 10px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); }
.tag.alc { border-color: var(--accent); color: var(--accent); }
.glass-wrap { display: flex; justify-content: center; padding: 8px 0 0; }
.glass-wrap svg { width: 150px; height: auto; max-width: 100%; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px 18px 8px; }
ul.ing { list-style: none; margin: 0; padding: 0; }
.ing li { display: flex; justify-content: space-between; gap: 16px; padding: 10px 0; border-top: 1px solid var(--line); }
.ing li:first-child { border-top: 0; }
.ing .amt { font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.ing .nm { min-width: 0; }
ol.steps { list-style: none; counter-reset: s; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
.steps li { counter-increment: s; display: grid; grid-template-columns: 1.7rem 1fr; gap: 6px; }
.steps li::before { content: counter(s); font-family: var(--font-display); font-weight: 700; color: var(--accent); }
.nav { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 20px; }
.btn { text-decoration: none; font-weight: 600; font-size: 15px; padding: 10px 16px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(8.5rem, 1fr)); gap: 12px; list-style: none; margin: 0; padding: 0; }
.grid a { display: flex; flex-direction: column; gap: 4px; min-width: 0; height: 100%; text-decoration: none; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
.grid .n { font-family: var(--font-display); font-weight: 700; font-size: 1.6rem; line-height: 1; }
.grid .t { font-weight: 600; font-size: 14px; }
.grid .s { font-size: 12px; color: var(--muted); }
.lede { color: var(--muted); margin: 10px 0 0; }
@media (prefers-reduced-motion: no-preference) { .glass-wrap svg { animation: rise .5s ease-out both; } @keyframes rise { from { transform: translateY(8px); opacity: .0; } to { transform: none; opacity: 1; } } }
</style>

<main id="app"></main>

function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }

function glass(d) {
  var a = d.liquid[0], b = d.liquid[1];
  return '<svg viewBox="0 0 150 230" role="img" aria-label="Glass of ' + esc(d.name) + '">' +
    '<defs><linearGradient id="lq" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="' + b + '"/><stop offset="1" stop-color="' + a + '"/></linearGradient>' +
    '<clipPath id="gc"><path d="M24 14 H126 L116 214 Q115 222 107 222 H43 Q35 222 34 214 Z"/></clipPath></defs>' +
    '<g clip-path="url(#gc)"><rect x="0" y="58" width="150" height="170" fill="url(#lq)"/>' +
    '<rect x="42" y="80" width="38" height="38" rx="5" fill="#ffffff" fill-opacity=".28" transform="rotate(-8 61 99)"/>' +
    '<rect x="78" y="116" width="34" height="34" rx="5" fill="#ffffff" fill-opacity=".22" transform="rotate(10 95 133)"/>' +
    '<rect x="46" y="150" width="32" height="32" rx="5" fill="#ffffff" fill-opacity=".2" transform="rotate(6 62 166)"/></g>' +
    '<path d="M24 14 H126 L116 214 Q115 222 107 222 H43 Q35 222 34 214 Z" fill="none" stroke="var(--fg)" stroke-width="3" stroke-linejoin="round"/>' +
    '<line x1="100" y1="2" x2="84" y2="120" stroke="var(--accent)" stroke-width="5" stroke-linecap="round"/></svg>';
}

function b64(s) {
  var b = atob(s), u = new Uint8Array(b.length);
  for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i);
  return u;
}

async function unlock(code) {
  var e = ENC[parseInt(code.charAt(0), 10) - 1];
  if (!e) return null;
  var base = await crypto.subtle.importKey("raw", new TextEncoder().encode(code), "PBKDF2", false, ["deriveKey"]);
  var key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(e.s), iterations: 100000, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  var pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(e.i) }, key, b64(e.c));
  return JSON.parse(new TextDecoder().decode(pt));
}

function locked(msg) {
  document.title = "Twenty Bar";
  document.getElementById("app").innerHTML =
    '<header><div class="eyebrow">Twenty today</div><h1>Twenty Bar</h1><p class="lede">' + esc(msg) + '</p></header>';
}

function drink(d) {
  document.title = d.name + " – Twenty Bar";
  var ing = d.ing.map(function (r) {
    return '<li><span class="nm">' + esc(r[1]) + '</span><span class="amt">' + esc(r[0]) + '</span></li>';
  }).join("");
  var steps = d.steps.map(function (s) { return '<li><span>' + esc(s) + '</span></li>'; }).join("");
  document.getElementById("app").innerHTML =
    '<header><div class="eyebrow">Card ' + esc(d.id) + ' of 09</div><h1>' + esc(d.name) + '</h1>' +
    '<p class="tagline">' + esc(d.title) + '</p><p class="msg">' + esc(d.note) + '</p>' +
    '<span class="tag' + (d.alc ? ' alc' : '') + '">' + (d.alc ? 'Contains alcohol' : 'Alcohol free') + '</span></header>' +
    '<div class="glass-wrap">' + glass(d) + '</div>' +
    '<section class="panel"><h2>Ingredients</h2><ul class="ing">' + ing + '</ul></section>' +
    '<section><h2>Method</h2><ol class="steps">' + steps + '</ol></section>';
}

async function route() {
  var m = /^#([1-9][a-z0-9]{9})$/.exec(location.hash);
  if (!m) { locked("Each card unlocks one drink. Scan the QR code on your card to open yours."); return; }
  if (!(window.crypto && crypto.subtle)) { locked("This browser can't open the card. Try the latest Chrome or Safari."); return; }
  locked("Unlocking your drink…");
  var d = null;
  try { d = await unlock(m[1]); } catch (e) { d = null; }
  if (location.hash !== m[0]) return;
  if (d) { drink(d); window.scrollTo(0, 0); }
  else locked("That code didn't unlock a drink. Scan your card again.");
}
window.addEventListener("hashchange", route);
route();
</script>
